name: DynoClaims
version: '${version}'
main: me.elonchunk.dynoClaims.DynoClaims
api-version: '1.21'
author: elonchunk
description: Claim your town's chunks from the Dynmap web map instead of walking them.
depend: [Towny]
softdepend: [Dynmap]

commands:
  webclaim:
    description: Get a link to claim land from the web map.
    usage: /webclaim