<!DOCTYPE html>
<html lang="en">
<head>
    <title>DynoClaims — Claim Your Land</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <style>
        :root {
            --accent: #7fbf3f; --accent-dim: #4f7a28; --danger: #c45b4d;
            --panel: #141810dd; --line: #2a3322; --text: #d8e0cd; --text-dim: #8a9478;
        }
        html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: #0c0f0a; }
        #page-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        #map { width: 100%; height: 100%; background: #0c0f0a; }

        #hud { position: absolute; top: 16px; left: 16px; z-index: 1000; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; min-width: 240px; color: var(--text); box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
        #hud h1 { font-size: 15px; margin: 0 0 4px; color: var(--accent); }
        #hud p { margin: 2px 0; font-size: 13px; color: var(--text-dim); }
        #hud .you { color: var(--text); font-weight: 600; }

        #toolbar { position: absolute; bottom: 16px; left: 16px; z-index: 1000; display: flex; gap: 8px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
        button { background: #1b220fcc; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
        button:hover { border-color: var(--accent-dim); }
        button.active { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
        button.primary { background: var(--accent); border-color: var(--accent); color: #0c0f0a; font-weight: 600; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        #status { position: absolute; top: 16px; right: 16px; z-index: 1000; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; font-size: 13px; color: var(--text-dim); max-width: 320px; }
        #status.error { border-color: var(--danger); color: var(--danger); }

        #hover { position: absolute; bottom: 16px; right: 16px; z-index: 1000; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--text-dim); }
        #confirm-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 2000; background: #141810; border: 1px solid var(--accent-dim); border-radius: 10px; padding: 20px 24px; min-width: 280px; color: var(--text); box-shadow: 0 8px 30px rgba(0,0,0,0.6); display: none; }
        #confirm-box h2 { margin: 0 0 10px; font-size: 16px; color: var(--accent); }
        #confirm-box .row { display: flex; justify-content: space-between; gap: 16px; margin-top: 16px; }
    </style>
</head>
<body>

<div id="page-container">
    <div id="map"></div>
</div>

<div id="hud">
    <h1>DynoClaims</h1>
    <p id="hud-welcome">Loading session…</p>
    <p id="hud-town"></p>
    <p id="hud-world"></p>
</div>

<div id="status">Checking your link…</div>
<div id="hover"></div>

<div id="toolbar">
    <button id="btn-outline">Draw Outline</button>
    <button id="btn-fill">Fill Inside</button>
    <button id="btn-toggle">Toggle Chunk</button>
    <button id="btn-brush">Brush Select</button>
    <button id="btn-clear">Clear Selection</button>
    <button id="btn-claim" class="primary" disabled>Claim Selected (0)</button>
</div>

<div id="confirm-box">
    <h2>Confirm Claim</h2>
    <p><span id="confirm-claimable">0</span> chunks will be claimed</p>
    <p><span id="confirm-owned">0</span> already owned (removed from selection)</p>
    <p id="confirm-note" style="color:var(--text-dim);font-size:12px"></p>
    <div class="row">
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-go" class="primary">Confirm &amp; Claim</button>
    </div>
</div>

<script src="claimcore.js?v={{VERSION}}"></script>
<script src="claimmanager.js?v={{VERSION}}"></script>
</body>
</html>
